[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishdet"
version = "0.1.0"
description = "Phishing email detection: TF-IDF and sentence-embedding models compared against an LLM classifier"
readme = "README.md"
requires-python = ">=3.10"
# exact versions used for the reported results are pinned in requirements.txt
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "joblib",
    "matplotlib",
    "httpx",
]

[project.optional-dependencies]
embed = ["torch", "sentence-transformers"]
dev = ["pytest"]

[project.scripts]
phishdet = "phishdet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
